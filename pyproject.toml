[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "termux-nas"
version = "0.1.0"
description = "Rootless SMB browser for Termux"
requires-python = ">=3.9"
dependencies = ["smbprotocol>=1.12,<2"]

[project.scripts]
nas = "termux_nas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
